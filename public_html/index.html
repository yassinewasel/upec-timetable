<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<script>
(function(){
  try{
    const key="edt-theme-v1";
    const saved=localStorage.getItem(key);

    const theme =
      saved==="dark" || saved==="light"
        ? saved
        : (
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
          );

    document.documentElement.dataset.theme=theme;
  }catch(e){
    document.documentElement.dataset.theme="light";
  }
})();
</script>

  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="EDT BUT Info">
  <title>EDT Informatique</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link rel="stylesheet" href="./css/style.css">

  <link rel="icon" href="./assets/icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="./assets/icons/favicon-48.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/icons/icon-192.png">

  <link rel="apple-touch-icon" sizes="180x180" href="./assets/icons/apple-touch-icon.png">

  <link rel="manifest" href="./manifest.webmanifest">

  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="EDT">

</head>
<body>

<main class="app">
  <section class="toolbar edt-nav" aria-label="Contrôles de l'emploi du temps">

      <div class="nav-top">

        <a class="edt-brand" href="/" aria-label="Accueil EDT Informatique">
          <img
            src="./assets/logo-transparent.png"
            class="edt-brand-logo"
            alt=""
            width="48"
            height="48"
          >

          <div class="edt-brand-copy">
            <div class="edt-brand-title">EDT Informatique</div>
            <div class="edt-brand-subtitle">BUT Informatique · UPEC</div>
          </div>
        </a>

        <div class="nav-actions">

          <button
            id="todayBtn"
            class="nav-action nav-action-secondary"
            type="button"
            title="Revenir à aujourd'hui"
            aria-label="Aujourd’hui"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7 2v3M17 2v3M3.5 9h17M5.5 4h13a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/>
              <path d="M8 13h3v3H8z"/>
            </svg>
            <span class="nav-action-label">Aujourd’hui</span>
          </button>

          <button
            id="saveImageBtn"
            class="nav-action nav-action-primary"
            type="button"
            title="Enregistrer l'emploi du temps"
            aria-label="Enregistrer l'emploi du temps"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3v12M7.5 10.5 12 15l4.5-4.5"/>
              <path d="M5 20h14"/>
            </svg>
            <span class="nav-action-label">Exporter</span>
          </button>

        </div>
      </div>

      <div class="nav-divider"></div>

      <div class="nav-controls">

        <div class="formation-area">
          <div class="control-caption">FORMATION</div>
          
<div class="formation-custom" id="formationCustom">

  <button
    class="formation-custom-trigger"
    id="formationCustomTrigger"
    type="button"
    aria-haspopup="listbox"
    aria-expanded="false"
  >
    <span id="formationCustomLabel">FI2</span>

    <svg
      class="formation-custom-chevron"
      viewBox="0 0 24 24"
      aria-hidden="true"
    >
      <path
        d="M7 9.5L12 14.5L17 9.5"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </button>

  <div
    class="formation-custom-menu"
    id="formationCustomMenu"
    role="listbox"
    hidden
  >
    <button
      type="button"
      class="formation-custom-option"
      data-formation="FI2"
      role="option"
    >
      <span>FI2</span>
      <span class="formation-custom-check">✓</span>
    </button>

    <button
      type="button"
      class="formation-custom-option"
      data-formation="FA2"
      role="option"
    >
      <span>FA2</span>
      <span class="formation-custom-check">✓</span>
    </button>
  </div>

</div>

        </div>


        <div class="week-area">
          <div class="control-caption">Semaine</div>
          <div class="week-strip" id="weekStrip"></div>
        </div>

        <div class="view-area">
          <div class="control-caption">Affichage</div>

          <div class="view-switch" aria-label="Mode d'affichage">
            <button id="weekViewBtn" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="5" width="18" height="14" rx="2"/>
                <path d="M9 5v14M15 5v14"/>
              </svg>
              <span>Semaine</span>
            </button>

            <button id="dayViewBtn" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="4" y="4" width="16" height="16" rx="2"/>
                <path d="M4 9h16"/>
              </svg>
              <span>Jour</span>
            </button>
          </div>
        </div>

      </div>

    </section>

  <section class="card" id="mainCard">
    <header class="heading">
      <h1>Emploi du temps</h1>
      <div class="subtitle" id="subtitle"></div>
    </header>

    <nav class="day-nav" id="dayNav" aria-label="Choix du jour"></nav>

    <div class="schedule-scroll" id="scheduleScroll">
      <div class="schedule" id="schedule">
        <div class="corner">Heure</div>
      </div>
    </div>
  </section>
</main>

<div id="exportStage" aria-hidden="true"></div>

<script src="./js/app.js"></script>
</body>
</html>
